# Manual Unity QA on the Windows self-hosted runner (see docs/UNITY_QA_RUNNER.md).
# Runs only allowlisted, read-only QA editor methods through Tools/QA/unity_qa.ps1. No builds, servers or databases.
# l6-visual previews (a few MB of JPEG/GIF) are published to the qa-results branch by a separate GitHub-hosted job,
# so the self-hosted job keeps a read-only token. Pushes made with GITHUB_TOKEN never trigger workflows.
name: Unity Windows QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "QA mode"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - compile-shader
          - l6-visual
      expected_sha:
        description: "Optional commit SHA (7-40 hex) that main must be at"
        type: string
        required: false
        default: ""
      reset_package_cache:
        description: "Delete only Library/PackageCache, ScriptAssemblies and Bee before running (imported assets are kept)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: unity-windows-qa
  cancel-in-progress: false

jobs:
  unity-qa:
    # Initial rollout: main of this repository only.
    if: github.repository == 'Ekergodmear/LangTroTan' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, unity-qa]
    timeout-minutes: 90
    env:
      QA_MODE: ${{ inputs.mode }}
      QA_EXPECTED_SHA: ${{ inputs.expected_sha }}
      QA_RESET_PACKAGE_CACHE: ${{ inputs.reset_package_cache }}
      QA_GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout (keeps the ignored Library cache)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Validate repository, branch, commit and mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QA_MODE -notin @('smoke', 'compile-shader', 'l6-visual')) { throw "Unknown mode" }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:QA_GITHUB_SHA) { throw "Checked-out HEAD $head does not match $env:QA_GITHUB_SHA" }
          if ($env:QA_EXPECTED_SHA) {
            if ($env:QA_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{7,40}$') { throw "expected_sha must be 7-40 hex characters" }
            if (-not $head.StartsWith($env:QA_EXPECTED_SHA.ToLower())) { throw "main is at $head, not $env:QA_EXPECTED_SHA" }
          }
          # Reset tracked files and remove untracked, non-ignored files (Library/ and other ignored caches stay).
          git reset --hard HEAD
          git clean -fd
          Write-Host "Validated $head ($env:QA_MODE)"

      - name: Run Unity QA
        shell: powershell
        run: |
          $reset = $env:QA_RESET_PACKAGE_CACHE -eq 'true'
          & "$env:GITHUB_WORKSPACE\Tools\QA\unity_qa.ps1" -Mode $env:QA_MODE -OutDir "$env:RUNNER_TEMP\unity-qa" -ResetPackageCache:$reset
          exit $LASTEXITCODE

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: unity-qa-${{ inputs.mode }}-${{ github.run_number }}
          path: ${{ runner.temp }}/unity-qa/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload previews for publishing
        if: always() && inputs.mode == 'l6-visual'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: qa-previews-${{ github.run_number }}
          path: ${{ runner.temp }}/unity-qa/previews/
          retention-days: 1
          if-no-files-found: ignore

      - name: Restore working tree
        if: always()
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fd

  # GitHub-hosted, no repository code: copies the known preview files into latest/ on the qa-results branch
  # (never main) so Claude Cloud and reviewers can read them with git. Only this job can write contents.
  publish-previews:
    needs: unity-qa
    if: >-
      always() && inputs.mode == 'l6-visual' && needs.unity-qa.result != 'skipped' &&
      github.repository == 'Ekergodmear/LangTroTan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download previews
        id: previews
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: qa-previews-${{ github.run_number }}
          path: previews

      - name: Publish to qa-results
        if: steps.previews.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_SHA: ${{ github.sha }}
          QA_RESULT: ${{ needs.unity-qa.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f previews/contact_sheet.jpg ]; then echo "No previews to publish"; exit 0; fi
          # Only the known preview files, flat names, size-capped
          mkdir -p stage/key
          for f in contact_sheet.jpg cycle_phases.jpg cycle_10s.gif cycle_stats.txt measurements.csv; do
            if [ -f "previews/$f" ]; then cp "previews/$f" stage/; fi
          done
          find previews/key -maxdepth 1 -type f -name 'v4_*.jpg' -exec cp {} stage/key/ \;
          size=$(du -sk stage | cut -f1)
          if [ "$size" -gt 15360 ]; then echo "Previews are ${size} KB (limit 15 MB); not publishing"; exit 1; fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${REPO}.git"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads origin qa-results > /dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 origin qa-results
            git checkout -q -b qa-results FETCH_HEAD
          else
            git checkout -q --orphan qa-results
          fi
          rm -rf latest && cp -r ../stage latest
          {
            echo "# Unity QA previews (latest l6-visual run)"
            echo
            echo "Generated by the Unity Windows QA workflow; not part of main. Do not merge this branch."
            echo
            echo "- Run: [${RUN_NUMBER}](${RUN_URL}), job result: ${QA_RESULT}"
            echo "- Commit: ${QA_SHA}"
            echo "- Files: latest/contact_sheet.jpg, latest/cycle_phases.jpg, latest/cycle_10s.gif, latest/key/*.jpg"
          } > README.md
          git add -A latest README.md
          git commit -q -m "QA previews: run ${RUN_NUMBER} (${QA_SHA:0:7}, l6-visual ${QA_RESULT})"
          git -c http.extraheader="$auth" push -q origin qa-results
          echo "Published to qa-results: run ${RUN_NUMBER}"
